# ==========================================
# DOCKER COMPOSE ДЛЯ РАЗРАБОТКИ
# Запуск: docker compose -f docker-compose.dev.yml watch
# ==========================================

services:
  # ==========================================
  # 1. БАЗА ДАННЫХ (PostgreSQL)
  # ==========================================
  postgres:
    image: postgres:17-alpine
    container_name: crypto-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"  # Пробрасываем для подключения из DBeaver/pgAdmin
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # 2. КЭШ (Redis)
  # ==========================================
  redis:
    image: redis:8-alpine
    container_name: crypto-redis-dev
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    ports:
      - "6379:6379"  # Пробрасываем для Redis CLI / GUI
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # 3. БЭКЕНД (NestJS) — режим разработки
  # ==========================================
  backend:
    build:
      context: ./back
      dockerfile: Dockerfile.dev
    container_name: crypto-backend-dev
    restart: unless-stopped
    ports:
      - "3000:3000"  # NestJS dev server
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL}
      FRONTEND_URL: http://localhost:5173
      YANDEX_CLIENT_ID: ${YANDEX_CLIENT_ID}
      YANDEX_CLIENT_SECRET: ${YANDEX_CLIENT_SECRET}
      YANDEX_CALLBACK_URL: http://localhost:3000/auth/yandex/callback
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM: ${RESEND_FROM}
      PASSWORD_RESET_TTL: ${PASSWORD_RESET_TTL}
      MARKET_DATA_PROVIDER: ${MARKET_DATA_PROVIDER}
      COINGECKO_API_URL: ${COINGECKO_API_URL}
      COINGECKO_API_KEY: ${COINGECKO_API_KEY}
      COINLORE_BASE_URL: ${COINLORE_BASE_URL}
    volumes:
      # Монтируем код с хоста в контейнер
      - ./back:/app
      # Исключаем node_modules — используем контейнерный
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Watch режим — автоматическая синхронизация
    # develop:
    #   watch:
    #     - action: sync
    #       path: ./back/src
    #       target: /app/src
    #     - action: rebuild
    #       path: ./back/package.json

  # ==========================================
  # 4. ФРОНТЕНД (Vite + React) — режим разработки
  # ==========================================
  frontend:
    build:
      context: ./front
      dockerfile: Dockerfile.dev
    container_name: crypto-frontend-dev
    restart: unless-stopped
    ports:
      - "5173:5173"  # Vite dev server
    environment:
      VITE_API_URL: http://localhost:3000
    volumes:
      # Монтируем код с хоста в контейнер
      - ./front:/app
      # Исключаем node_modules — используем контейнерный
      - /app/node_modules
    depends_on:
      - backend
    # Watch режим
    # develop:
    #   watch:
    #     - action: sync
    #       path: ./front/src
    #       target: /app/src
    #     - action: rebuild
    #       path: ./front/package.json

# ==========================================
# ТОМЫ (данные сохраняются между перезапусками)
# ==========================================
volumes:
  postgres_data_dev:
